<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project | Portfolio Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 18px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .back-link {
            color: #38bdf8;
            text-decoration: none;
        }

        .form-card {
            margin-top: 24px;
            padding: 28px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #94a3b8;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: #f8fafc;
            font: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .checkbox-row input {
            width: auto;
        }

        .checkbox-row label {
            margin: 0;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .note {
            margin-top: 18px;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="container">
        <a class="back-link"
           href="{{ url_for('admin_projects') }}">
            ← Back to Projects
        </a>

        <div class="form-card">
            <h1>Add New Project</h1>

            <p class="subtitle">
                Enter your project details below.
            </p>

            <form method="POST"
                    action="{{ url_for('admin_add_project') }}"
                    enctype="multipart/form-data">

                <label for="name">Project Name *</label>
                <input id="name" name="name"
                       type="text" maxlength="120"
                       required>

                <label for="category">Category *</label>
                <input id="category" name="category"
                       type="text" maxlength="100"
                       required>

                <label for="description">Description *</label>
                <textarea id="description"
                          name="description"
                          maxlength="1000"
                          required></textarea>

                <label for="github">GitHub URL</label>
                <input id="github" name="github"
                       type="url" maxlength="500"
                       placeholder="https://github.com/username/project">

                <label for="demo">Live Demo URL</label>
                <input id="demo" name="demo"
                       type="url" maxlength="500"
                       placeholder="https://example.com">

                
                <label for="image">Project Image</label>
                <input id="image" name="image"
                    type="file" accept="image/*" required>


                <div class="checkbox-row">
                    <input id="featured" name="featured"
                           type="checkbox" value="yes">
                    <label for="featured">Featured Project</label>
                </div>

                <button type="submit">Save Project</button>
            </form>

            <p class="note">
                Project details will be saved after the backend
                route is connected. Existing projects will be preserved.
            </p>
        </div>
    </main>
</body>
</html>
